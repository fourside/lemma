name = "lemma"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "lemma"
database_id = "151c03c9-c25f-4dbe-bdc1-48e67a6a57b1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "lemma-content"

# Secrets (set via `wrangler secret put`, local dev values in .dev.vars)
# - JWT_SECRET
